<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RRT Classement</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="logo">🚀</div>
  <div>
    <h1>RRT - Rocket Racing Team</h1>
    <p>Fall 2026 - 10 premiers circuits gratuits &middot; <span id="updated">Classement RRT</span></p>
  </div>
</header>
<main>
  <div class="card">
    <table id="board">
      <thead>
        <tr>
          <th class="rank">#</th>
          <th class="pilot">Pilote</th>
          <th>C1</th><th>C2</th><th>C3</th><th>C4</th><th>C5</th>
          <th>C6</th><th>C7</th><th>C8</th><th>C9</th><th>C10</th>
          <th class="total">Total</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <p class="legend">Dans chaque case : le temps, puis les points. <b>—</b> = circuit pas encore fait. Bar&egrave;me : 32 - 26 - 22 - 19 - 17 - 15 - 13 - 11 - 9 - 7 - 5 - 4 - 3 - 2 - 1 - 0</p>
  </div>
  <div class="actions">
    <button id="copyDiscord">Copier pour Discord</button>
    <span id="copyMsg"></span>
  </div>
</main>
<script src="app.js"></script>
</body>
</html>
